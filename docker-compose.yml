# docker-compose.yml
# Запуск API и Qdrant.

services:
  api:
    image: vs-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_QDRANT_URL: http://qdrant:6333
      APP_EMBEDDING_DEVICE: ${APP_EMBEDDING_DEVICE:-auto}
      APP_YOLO_DEVICE: ${APP_YOLO_DEVICE:-auto}
      APP_OCR_DEVICE: ${APP_OCR_DEVICE:-auto}
      APP_OCR_ENABLED: ${APP_OCR_ENABLED:-true}
    volumes:
      - ./data:/app/data:ro
      - huggingface-cache:/root/.cache/huggingface
      - paddle-cache:/root/.paddlex
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    shm_size: 2gb

  postgres:
    profiles: ["catalog"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-wine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wine_password}
      POSTGRES_DB: ${DB_NAME:-vino_svoe}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - vs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-wine} -d ${DB_NAME:-vino_svoe}" ]
      interval: 2s
      timeout: 2s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - vs-qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  vs-postgres-data:
  vs-qdrant-data:
  huggingface-cache:
  paddle-cache:
