[project]
name = "vino-svoe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "alembic>=1.16",
    "numpy>=2.5.2",
    "pillow>=10",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.19.0",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0",
    "torch>=2.13.0",
    "transformers>=4.52",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.163",
    "uvicorn>=0.52.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.17",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/services/ocr.py" = ["BLE001"]

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
