[project]
name = "vino-svoe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pillow>=10",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=4.52",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
